# Atualiza live.json com os dados da API oficial da FPL (classificação, plantéis, chips, preços, lesões)
# e rivals.json (histórico completo de cada rival, para prever transferências, capitão e chips).
name: Atualizar dados FPL

on:
  schedule:
    - cron: '0 7 * * 2'   # terça 07:00 UTC
    - cron: '0 7 * * 5'   # sexta 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fpl-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ir buscar os dados à API da FPL
        run: python scripts/fpl_fetch.py
      - name: Guardar live.json e rivals.json no repositório
        run: |
          git config user.name "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add live.json rivals.json
          if git diff --staged --quiet; then
            echo "Sem alterações."
          else
            git commit -m "Dados FPL $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
