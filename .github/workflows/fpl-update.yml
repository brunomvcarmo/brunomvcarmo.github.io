# Atualiza live.json com os dados da API oficial da FPL (classificação, plantéis, chips, preços, lesões),
# rivals.json (histórico completo de cada rival, para prever transferências, capitão e chips)
# e history/points-J<n>.json (pontos e minutos de todos os jogadores em cada jornada, para o Laboratório).
name: Atualizar dados FPL

on:
  schedule:
    - cron: '0 7 * * 2'   # terça 07:00 UTC
    - cron: '0 7 * * 5'   # sexta 07:00 UTC
    - cron: '23 */3 * * *' # de 3 em 3 horas: só trabalha perto de um deadline (ver scripts/fpl_quando.py)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fpl-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decidir se é preciso (véspera e dia do deadline, terça e sexta, ou dados com mais de 72 h)
        id: quando
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: python scripts/fpl_quando.py
      - name: Ir buscar os dados à API da FPL
        if: steps.quando.outputs.run == 'true'
        run: python scripts/fpl_fetch.py
      - name: Guardar live.json, rivals.json e history/ no repositório
        if: steps.quando.outputs.run == 'true'
        run: |
          git config user.name "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add live.json rivals.json
          if [ -d history ]; then git add history; fi
          if git diff --staged --quiet; then
            echo "Sem alterações."
          else
            git commit -m "Dados FPL $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
