<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f9fd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161c2c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PORT 103">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Flashcards PORT 103</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one study column (max 720px); azulejo tile strip as the only ornament; card in the centre, controls above, grading below */
:root{
  --bg:#f7f9fd; --surface:#ffffff; --ink:#2f3a55; --muted:#7f8aa3; --line:#e6ebf4;
  --azul:#6b8fdb; --azul-ink:#ffffff; --azul-soft:#eef3fd; --tile:#dfe8f8;
  --ok:#3f9c77; --ok-soft:#e8f6ef; --bad:#d27264; --bad-soft:#fdeeeb; --warn:#bb8c2f; --warn-soft:#fcf5e3;
  --shadow:0 2px 6px rgba(80,105,160,.06),0 14px 34px rgba(80,105,160,.08);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161c2c; --surface:#1e263a; --ink:#e3e8f3; --muted:#a0abc2; --line:#2e3850;
  --azul:#93b3f1; --azul-ink:#161c2c; --azul-soft:#253150; --tile:#34456c;
  --ok:#6ccc9f; --ok-soft:#1d3a30; --bad:#f19a8a; --bad-soft:#40272a; --warn:#ebc06a; --warn-soft:#3a3120;
  --shadow:0 2px 6px rgba(0,0,0,.18),0 14px 34px rgba(0,0,0,.22);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161c2c; --surface:#1e263a; --ink:#e3e8f3; --muted:#a0abc2; --line:#2e3850;
  --azul:#93b3f1; --azul-ink:#161c2c; --azul-soft:#253150; --tile:#34456c;
  --ok:#6ccc9f; --ok-soft:#1d3a30; --bad:#f19a8a; --bad-soft:#40272a; --warn:#ebc06a; --warn-soft:#3a3120;
  --shadow:0 2px 6px rgba(0,0,0,.18),0 14px 34px rgba(0,0,0,.22);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 48px}
.tiles{height:12px;background:
  radial-gradient(circle at 50% 50%, var(--azul) 0 22%, transparent 23%) 0 0/24px 24px,
  conic-gradient(from 45deg, var(--tile) 25%, transparent 0 50%, var(--tile) 0 75%, transparent 0) 0 0/24px 24px, var(--azul-soft)}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-block:20px 12px}
header.top>div{min-width:0}
.theme-btn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--azul);display:grid;place-items:center;box-shadow:0 2px 8px rgba(80,105,160,.08);-webkit-tap-highlight-color:transparent;transition:transform .15s}
.theme-btn:hover{transform:rotate(-12deg)}
.theme-btn svg{width:22px;height:22px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,5vw,34px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--azul)}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px}
.ghost:hover{border-color:var(--azul)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
nav.tabs button{background:none;border:0;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--azul)}
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:0 2px 8px rgba(80,105,160,.05)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:14px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--azul);color:var(--azul-ink);font-weight:700}
label.inline{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
details.topics{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
details.topics>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:700}
details.topics>summary::-webkit-details-marker{display:none}
details.topics>summary .chev{transition:transform .2s;color:var(--muted)}
details.topics[open]>summary .chev{transform:rotate(180deg)}
.topics-body{padding:0 14px 14px;display:grid;gap:14px}
.topics-actions{display:flex;gap:8px;flex-wrap:wrap}
.grp-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.grp h3{font-family:var(--f-display);font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:700}
.ghost.small{padding:3px 10px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 10px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--azul-soft);border-color:var(--azul);font-weight:700}
.chip small{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.status{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted);margin-bottom:6px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.bar{height:8px;background:var(--azul-soft);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--azul);width:0;transition:width .3s}
/* one menu for the four ways to study */
.views{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:5px;margin-bottom:14px;box-shadow:0 2px 10px rgba(80,105,160,.06)}
.views button{border:0;background:none;border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:700;color:var(--muted);-webkit-tap-highlight-color:transparent}
.views svg{width:22px;height:22px}
.views button[aria-pressed="true"]{background:var(--azul-soft);color:var(--azul)}
/* what am I studying */
details.topics>summary .sum-l{display:grid;min-width:0}
.sum-k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.sum-v{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum-btn{flex:none;color:var(--azul);background:var(--azul-soft);font-size:14px;font-weight:700;padding:6px 14px;border-radius:999px}
.groups{display:grid;gap:10px}
.grp{border:1px solid var(--line);border-radius:18px;background:var(--bg)}
.grp-row{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:12px 14px;text-align:left;border-radius:18px;-webkit-tap-highlight-color:transparent}
.tick{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--surface)}
.grp-row[aria-pressed="true"] .tick{background:var(--azul);border-color:var(--azul)}
.grp-row[aria-pressed="true"] .tick::after{content:"";width:6px;height:11px;border:solid var(--azul-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.grp-row[aria-pressed="mixed"] .tick{border-color:var(--azul)}
.grp-row[aria-pressed="mixed"] .tick::after{content:"";width:10px;height:3px;background:var(--azul);border-radius:2px}
.grp-txt{display:grid;min-width:0}
.grp-name{font-weight:700;font-size:16px}
.grp-meta{font-size:13px;color:var(--muted)}
.grp-more>summary{list-style:none;cursor:pointer;padding:0 14px 12px 50px;font-size:13px;font-weight:700;color:var(--azul)}
.grp-more>summary::-webkit-details-marker{display:none}
.grp-more .chips{padding:0 14px 14px}
.settings{display:grid;border-top:1px solid var(--line);padding-top:12px}
.settings h3{font-family:var(--f-display);font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 2px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;padding:8px 0;font-size:15px;flex-wrap:wrap}
.set-row .seg button{padding:6px 10px}
.switch{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch:checked{background:var(--azul)}
.switch:checked::after{transform:translateX(18px)}
@media (max-width:700px){
  .views{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;border-radius:22px 22px 0 0;border-width:1px 0 0;box-shadow:0 -4px 18px rgba(80,105,160,.10);
    padding:6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px))}
  .wrap{padding-bottom:110px}
}
/* swipe, undo, resume */
.card.noanim{transition:none!important}
.card.drag-yes .face{border-color:var(--ok);box-shadow:0 0 0 4px var(--ok-soft), var(--shadow)}
.card.drag-no .face{border-color:var(--bad);box-shadow:0 0 0 4px var(--bad-soft), var(--shadow)}
@keyframes cardIn{from{opacity:.2;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.scene.enter{animation:cardIn .28s ease-out}
.swipehint{display:none;font-size:13px;color:var(--muted);text-align:center;margin-top:10px;min-height:1em}
@media (hover:none){.swipehint{display:block}}
.linkbtn{border:0;background:none;color:var(--azul);font-weight:700;font-size:14px;padding:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));z-index:30;transform:translate(-50%, 12px);opacity:0;transition:opacity .2s, transform .2s;
  width:max-content;max-width:min(92vw, 440px);display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 10px 10px 16px;box-shadow:0 8px 24px rgba(20,30,60,.25);font-size:15px}
.toast.show{opacity:1;transform:translate(-50%, 0)}
.toast span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{flex:none;border:0;border-radius:10px;padding:8px 14px;font-weight:700;background:var(--azul);color:var(--azul-ink)}
@media (max-width:700px){ .toast{bottom:calc(92px + env(safe-area-inset-bottom, 0px))} }
@media (prefers-reduced-motion: reduce){ .scene.enter{animation:none} .toast{transition:none} }
/* card */
.scene{perspective:1400px;margin-bottom:16px}
.card{position:relative;display:grid;min-height:260px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.3,1);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:pan-y}
.settings-row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.card.flipped{transform:rotateY(180deg)}
.face{position:relative;grid-area:1 / 1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 22px 24px;text-align:center;gap:12px;box-shadow:var(--shadow);overflow:hidden}
.face.back{transform:rotateY(180deg)}
.face.back::before{content:"";position:absolute;inset:0 0 auto 0;height:12px;background:
  radial-gradient(circle at 50% 50%, var(--azul) 0 22%, transparent 23%) 0 0/24px 24px,
  conic-gradient(from 45deg, var(--tile) 25%, transparent 0 50%, var(--tile) 0 75%, transparent 0) 0 0/24px 24px, var(--azul-soft)}
.face .tag{position:absolute;top:12px;left:14px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.face.back .tag{top:20px}
.face .lang{position:absolute;top:12px;right:14px;font-size:12px;font-weight:700;color:var(--azul);letter-spacing:.06em}
.face.back .lang{top:20px}
.word{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,6vw,40px);line-height:1.15;text-wrap:balance;overflow-wrap:anywhere;max-width:100%}
.word.long{font-size:clamp(20px,4.4vw,28px)}
.hint{color:var(--muted);font-size:14px}
.trans{font-size:clamp(17px,3.8vw,22px);color:var(--muted);border-top:2px solid var(--azul-soft);padding-top:10px;max-width:100%;overflow-wrap:anywhere;text-wrap:balance}
.btn:disabled{opacity:.4;cursor:default}
.speak{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.speak:hover{border-color:var(--azul)}
.speak svg{width:16px;height:16px}
.feedback{font-weight:700;border-radius:10px;padding:6px 12px;font-size:15px}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback.warn{background:var(--warn-soft);color:var(--warn)}
.yours{font-size:14px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions.one{grid-template-columns:1fr}
.btn{border:0;border-radius:18px;padding:15px 18px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s, filter .12s}
.btn:not(:disabled):hover{filter:brightness(1.03);transform:translateY(-1px)}
.btn.primary{box-shadow:0 6px 16px rgba(107,143,219,.28)}
.btn.primary{background:var(--azul);color:var(--azul-ink)}
.btn.no{background:var(--bad-soft);color:var(--bad)}
.btn.yes{background:var(--ok-soft);color:var(--ok)}
.btn.plain{background:var(--surface);border:1px solid var(--line)}
.btn kbd{font-family:var(--f-body);font-size:12px;opacity:.7;border:1px solid currentColor;border-radius:5px;padding:0 5px}
.typebox{display:flex;gap:8px;margin-bottom:10px}
.typebox input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;font-size:17px}
.typebox input:focus{border-color:var(--azul)}
.accents{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.accents button{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:36px;padding:4px 8px;font-size:16px}
.keys{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
/* summary */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:24px 20px;display:grid;gap:14px}
.summary h2{font-family:var(--f-display);margin:0;font-size:26px}
.nums{display:flex;gap:24px;flex-wrap:wrap}
.nums div{display:grid}
.nums b{font-family:var(--f-display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.nums span{font-size:13px;color:var(--muted)}
.review{display:grid;gap:4px;font-size:15px}
.review div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-block:4px}
.review div span:last-child{color:var(--muted);text-align:right}
/* list */
.listtools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.listtools input{flex:1 1 220px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lgroup{margin-bottom:22px}
.lgroup h3{font-family:var(--f-display);font-size:18px;margin:0 0 6px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lgroup h3 small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:400}
.row{display:grid;grid-template-columns:12px minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.row .pt{font-weight:700;overflow-wrap:anywhere}
.row .en{color:var(--muted);overflow-wrap:anywhere}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.l1{background:var(--warn)} .dot.l2{background:var(--ok)}
.row .speak{padding:4px 8px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.legend span{display:inline-flex;gap:6px;align-items:center}
footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--muted);align-items:center}
.confirm{display:inline-flex;gap:8px;align-items:center}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:28px;padding:28px 20px;text-align:center;display:grid;gap:12px;justify-items:center}
@media (max-width:520px){
  .row{grid-template-columns:10px minmax(0,1fr) auto}
  .row .en{grid-column:2;grid-row:2;font-size:14px}
  .row .speak{grid-row:1 / span 2;grid-column:3}
  .card{min-height:220px}
  header.top{padding-block:14px 8px}
  h1{font-size:24px}
  .sub{font-size:13px;margin-top:2px}
  nav.tabs{margin-bottom:12px}
  nav.tabs button{padding:8px 12px}
  .controls{gap:8px;margin-bottom:10px}
  .seg{display:flex;width:100%}
  .seg button{flex:1;padding:7px 6px}
  details.topics{margin-bottom:12px}
  details.topics>summary{padding:10px 14px;font-size:15px}
  .bar{margin-bottom:12px}
  .face{padding:46px 18px 20px}
  .btn{padding:14px 12px}
}
@media (hover:none){ .keys, .btn kbd{display:none} }
@media (prefers-reduced-motion: reduce){.card{transition:none}.bar i{transition:none}}
</style>
</head>
<body>
<div class="tiles" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Flashcards <span>PORT 103</span></h1>
      <div class="sub" id="sub"></div>
    </div>
    <button class="ghost" id="uiLang" type="button" hidden></button>
    <button class="theme-btn" id="themeBtn" type="button"></button>
  </header>

  <nav class="views" id="views" aria-label="Study mode"></nav>

  <section id="study">
    <details class="topics" id="topics">
      <summary>
        <span class="sum-l"><span class="sum-k" id="topicsLabel"></span><span class="sum-v" id="topicsTitle"></span></span>
        <span class="sum-btn" id="topicsBtn"></span>
      </summary>
      <div class="topics-body">
        <div id="topicGroups" class="groups"></div>
        <div class="settings">
          <h3 id="setTitle"></h3>
          <div class="set-row" id="dirRow"><span id="lblDir"></span><div class="seg" id="dirSeg" role="group"></div></div>
          <div class="set-row" id="roundWrap"><label for="roundSize" id="lblRound"></label>
            <select id="roundSize"><option value="10">10</option><option value="20">20</option><option value="40">40</option><option value="0"></option></select>
          </div>
          <label class="set-row" for="weakOnly"><span id="lblWeak"></span><input type="checkbox" id="weakOnly" class="switch"></label>
          <div class="set-row"><span id="resetWrap"></span></div>
        </div>
        <button class="btn primary" type="button" data-act="closetopics" id="doneBtn"></button>
      </div>
    </details>

    <div id="player">
      <div class="status"><span id="stRound"></span><span id="stCounts"></span></div>
      <div class="bar"><i id="barFill"></i></div>
      <div class="scene">
        <div class="card" id="card" tabindex="0" role="button">
          <div class="face front">
            <span class="tag" id="fTag"></span><span class="lang" id="fLang"></span>
            <div class="word" id="fWord"></div>
            <div class="trans" id="fTrans" hidden></div>
            <div class="hint" id="fHint"></div>
            <button class="speak" type="button" id="fSpeak" hidden></button>

// light / dark switch (remembers the choice; follows the phone until you press it)
var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

// swipe: Learn = change card; Flashcards (after flipping) = right "I know it", left "Again"
var drag = null, swipedAt = 0;
function canSwipe(){ return (S.mode === 'learn' && LR.list.length) || (S.mode === 'flip' && R && R.flipped && cur()); }
(function(){
  var card = $('card');
  function reset(){ card.style.transition = ''; card.style.transform = ''; card.classList.remove('drag-yes', 'drag-no'); }
  card.addEventListener('touchstart', function(e){ var t = e.touches[0]; drag = {x: t.clientX, y: t.clientY, dx: 0, on: false}; }, {passive:true});

      else { if(Math.abs(dy) > 10) drag = null; return; }
    }
    if(!canSwipe()) return;
    drag.dx = dx;
    card.style.transition = 'none';
    card.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 22) + 'deg)' + (card.classList.contains('flipped') ? ' rotateY(180deg)' : '');

document.addEventListener('keydown', function(e){
