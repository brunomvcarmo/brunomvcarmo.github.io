<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f9fd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161c2c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PORT 103">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Flashcards PORT 103</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one study column (max 720px); azulejo tile strip as the only ornament; card in the centre, controls above, grading below */
:root{
  --bg:#f7f9fd; --surface:#ffffff; --ink:#2f3a55; --muted:#7f8aa3; --line:#e6ebf4;
  --azul:#6b8fdb; --azul-ink:#ffffff; --azul-soft:#eef3fd; --tile:#dfe8f8;
  --ok:#3f9c77; --ok-soft:#e8f6ef; --bad:#d27264; --bad-soft:#fdeeeb; --warn:#bb8c2f; --warn-soft:#fcf5e3;
  --shadow:0 2px 6px rgba(80,105,160,.06),0 14px 34px rgba(80,105,160,.08);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161c2c; --surface:#1e263a; --ink:#e3e8f3; --muted:#a0abc2; --line:#2e3850;
  --azul:#93b3f1; --azul-ink:#161c2c; --azul-soft:#253150; --tile:#34456c;
  --ok:#6ccc9f; --ok-soft:#1d3a30; --bad:#f19a8a; --bad-soft:#40272a; --warn:#ebc06a; --warn-soft:#3a3120;
  --shadow:0 2px 6px rgba(0,0,0,.18),0 14px 34px rgba(0,0,0,.22);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161c2c; --surface:#1e263a; --ink:#e3e8f3; --muted:#a0abc2; --line:#2e3850;
  --azul:#93b3f1; --azul-ink:#161c2c; --azul-soft:#253150; --tile:#34456c;
  --ok:#6ccc9f; --ok-soft:#1d3a30; --bad:#f19a8a; --bad-soft:#40272a; --warn:#ebc06a; --warn-soft:#3a3120;
  --shadow:0 2px 6px rgba(0,0,0,.18),0 14px 34px rgba(0,0,0,.22);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 48px}
.tiles{height:12px;background:
  radial-gradient(circle at 50% 50%, var(--azul) 0 22%, transparent 23%) 0 0/24px 24px,
  conic-gradient(from 45deg, var(--tile) 25%, transparent 0 50%, var(--tile) 0 75%, transparent 0) 0 0/24px 24px, var(--azul-soft)}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-block:20px 12px}
header.top>div{min-width:0}
.theme-btn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--azul);display:grid;place-items:center;box-shadow:0 2px 8px rgba(80,105,160,.08);-webkit-tap-highlight-color:transparent;transition:transform .15s}
.theme-btn:hover{transform:rotate(-12deg)}
.theme-btn svg{width:22px;height:22px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,5vw,34px);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--azul)}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px}
.ghost:hover{border-color:var(--azul)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
nav.tabs button{background:none;border:0;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--azul)}
.controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:12px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:0 2px 8px rgba(80,105,160,.05)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:14px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--azul);color:var(--azul-ink);font-weight:700}
label.inline{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
details.topics{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px}
details.topics>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:700}
details.topics>summary::-webkit-details-marker{display:none}
details.topics>summary .chev{transition:transform .2s;color:var(--muted)}
details.topics[open]>summary .chev{transform:rotate(180deg)}
.topics-body{padding:0 14px 14px;display:grid;gap:14px}
.topics-actions{display:flex;gap:8px;flex-wrap:wrap}
.grp-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.grp h3{font-family:var(--f-display);font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:700}
.ghost.small{padding:3px 10px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 10px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--azul-soft);border-color:var(--azul);font-weight:700}
.chip small{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.status{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted);margin-bottom:6px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.bar{height:8px;background:var(--azul-soft);border-radius:99px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--azul);width:0;transition:width .3s}
/* one menu for the four ways to study */
.views{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:5px;margin-bottom:14px;box-shadow:0 2px 10px rgba(80,105,160,.06)}
.views button{border:0;background:none;border-radius:16px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;font-weight:700;color:var(--muted);-webkit-tap-highlight-color:transparent}
.views svg{width:22px;height:22px}
.views button[aria-pressed="true"]{background:var(--azul-soft);color:var(--azul)}
/* what am I studying */
details.topics>summary .sum-l{display:grid;min-width:0}
.sum-k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.sum-v{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum-btn{flex:none;color:var(--azul);background:var(--azul-soft);font-size:14px;font-weight:700;padding:6px 14px;border-radius:999px}
.groups{display:grid;gap:10px}
.grp{border:1px solid var(--line);border-radius:18px;background:var(--bg)}
.grp-row{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:12px 14px;text-align:left;border-radius:18px;-webkit-tap-highlight-color:transparent}
.tick{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--surface)}
.grp-row[aria-pressed="true"] .tick{background:var(--azul);border-color:var(--azul)}
.grp-row[aria-pressed="true"] .tick::after{content:"";width:6px;height:11px;border:solid var(--azul-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.grp-row[aria-pressed="mixed"] .tick{border-color:var(--azul)}
.grp-row[aria-pressed="mixed"] .tick::after{content:"";width:10px;height:3px;background:var(--azul);border-radius:2px}
.grp-txt{display:grid;min-width:0}
.grp-name{font-weight:700;font-size:16px}
.grp-meta{font-size:13px;color:var(--muted)}
.grp-more>summary{list-style:none;cursor:pointer;padding:0 14px 12px 50px;font-size:13px;font-weight:700;color:var(--azul)}
.grp-more>summary::-webkit-details-marker{display:none}
.grp-more .chips{padding:0 14px 14px}
.settings{display:grid;border-top:1px solid var(--line);padding-top:12px}
.settings h3{font-family:var(--f-display);font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 2px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;padding:8px 0;font-size:15px;flex-wrap:wrap}
.set-row .seg button{padding:6px 10px}
.switch{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;margin:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch:checked{background:var(--azul)}
.switch:checked::after{transform:translateX(18px)}
@media (max-width:700px){
  .views{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;border-radius:22px 22px 0 0;border-width:1px 0 0;box-shadow:0 -4px 18px rgba(80,105,160,.10);
    padding:6px max(10px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px))}
  .wrap{padding-bottom:110px}
}
/* practice */
.p-head h2{font-family:var(--f-display);font-size:26px;margin:4px 0 4px}
.p-head p{margin:0 0 16px;color:var(--muted)}
.p-tiles{display:grid;grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));gap:12px}
.p-tile{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;column-gap:14px;row-gap:4px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.p-tile svg{grid-row:1 / span 3;width:42px;height:42px;padding:9px;border-radius:14px;background:var(--azul-soft);color:var(--azul)}
.p-tile-t{font-family:var(--f-display);font-weight:700;font-size:18px}
.p-tile-d{color:var(--muted);font-size:14px}
.p-tile-n{font-size:13px;font-weight:700;color:var(--azul)}
.p-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.p-title{font-family:var(--f-display);font-weight:700;font-size:18px;flex:1;text-align:center}
.p-count{min-width:70px}
.linkbtn.muted{color:var(--muted);font-weight:400}
.p-filter{margin-bottom:12px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.p-filter .chip{flex:none}
.p-card{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:16px 10px 20px;margin-bottom:14px;display:grid;gap:10px;justify-items:center;text-align:center}
.p-kicker{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.p-verb{font-family:var(--f-display);font-size:32px;font-weight:700}
.p-verb small{font-family:var(--f-body);font-size:15px;font-weight:400;color:var(--muted)}
.p-tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.p-tags span{background:var(--azul-soft);border-radius:999px;padding:5px 12px;font-size:14px}
.p-sent{font-family:var(--f-display);font-size:clamp(20px,5vw,26px);font-weight:600;line-height:1.35;text-wrap:balance}
.p-word{font-family:var(--f-display);font-size:clamp(26px,7vw,36px);font-weight:700}
.p-en{color:var(--muted);font-size:15px}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--azul);margin:0 4px;vertical-align:-2px;height:1em}
.filled{color:var(--azul);border-bottom:3px solid var(--azul-soft)}
.p-help{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.chip.mini{padding:4px 10px;font-size:14px}
.p-links{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px}
.p-fb{border-radius:20px;padding:14px 16px;margin-bottom:14px;display:grid;gap:8px}
.p-fb.ok{background:var(--ok-soft)} .p-fb.bad{background:var(--bad-soft)} .p-fb.warn{background:var(--warn-soft)}
.p-res{font-weight:700;font-size:16px}
.p-fb.ok .p-res{color:var(--ok)} .p-fb.bad .p-res{color:var(--bad)} .p-fb.warn .p-res{color:var(--warn)}
.p-full{font-family:var(--f-display);font-size:18px}
.why{font-size:15px}
.p-again{font-size:13px;color:var(--muted)}
.vt{border-collapse:collapse;font-size:15px;justify-self:start}
.vt caption{text-align:left;font-weight:700;font-size:13px;color:var(--muted);padding-bottom:4px}
.vt td{padding:3px 14px 3px 0}
.vt tr.hl td{font-weight:700;color:var(--azul)}
.typebox input.nudge{animation:nudge .3s}
@keyframes nudge{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.scene-svg{width:100%;max-width:520px;height:auto;border-radius:16px;border:1px solid var(--line)}
.swall{fill:var(--azul-soft)} .sfloor{fill:var(--tile)}
.scene-svg .so{fill:var(--surface);stroke:var(--muted);stroke-width:1.4}
.scene-svg .sa{fill:var(--tile);stroke:var(--muted);stroke-width:1.2}
.scene-svg .sg{fill:var(--ok-soft);stroke:var(--ok);stroke-width:1.2}
.scene-svg .sm{fill:var(--bg);stroke:var(--muted);stroke-width:1.4}
.scene-svg .sd{fill:var(--ink);stroke:none}
.scene-svg .sl{stroke:var(--muted);stroke-width:1.4;fill:none}
.scene-svg .th{stroke-width:3;stroke-linecap:round}
.scene-svg .sw{stroke:var(--azul);stroke-width:1.2}
.scene-svg .hl .so,.scene-svg .hl .sa,.scene-svg .hl .sm{stroke:var(--azul);stroke-width:2.6}
.scene-svg .hl .sl{stroke:var(--azul)}
.scene-svg .st{font:700 11.5px var(--f-body);fill:var(--muted);text-anchor:middle;paint-order:stroke;stroke:var(--azul-soft);stroke-width:3px}
.scene-svg .st.hl{fill:var(--azul);font-weight:700}
.p-intro{color:var(--muted);margin:0 0 12px}
.pool{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 14px;margin-bottom:12px;position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;box-shadow:var(--shadow)}
.pool-h{font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between}
.pool-h small{color:var(--muted);font-weight:400}
.chip.item{background:var(--surface);font-weight:700}
.pool .chip.item{background:var(--azul-soft);border-color:var(--azul)}
.chip.good{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.chip.badc{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.chip:disabled{cursor:default;opacity:1}
.stores{display:grid;grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));gap:10px;margin-bottom:14px}
.store{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:10px 12px;min-height:72px}
.store-h{display:grid;margin-bottom:6px}
.store-h small{color:var(--muted);font-size:12px}
.muted{color:var(--muted)}
.review.fix div{align-items:flex-start}
.review.fix small{color:var(--bad)}
.sheet-bg{position:fixed;inset:0;background:rgba(20,28,48,.35);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:24px 24px 0 0;box-shadow:0 -10px 30px rgba(20,30,60,.2);max-height:80vh;overflow:auto;
  padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sheet-h{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px;font-size:16px}
.sheet-grid{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:8px;max-width:640px;margin:0 auto}
.store-pick{display:grid;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:10px 12px;font-size:15px}
.store-pick small{color:var(--muted);font-size:12px}
.store-pick[aria-pressed="true"]{border-color:var(--azul);background:var(--azul-soft)}
.store-pick.back{grid-column:1 / -1}
@media (min-width:701px){ .sheet{left:50%;right:auto;bottom:24px;transform:translateX(-50%);width:min(640px, 92vw);border-radius:24px} }
/* swipe, undo, resume */
.card.noanim{transition:none!important}
.card.drag-yes .face{border-color:var(--ok);box-shadow:0 0 0 4px var(--ok-soft), var(--shadow)}
.card.drag-no .face{border-color:var(--bad);box-shadow:0 0 0 4px var(--bad-soft), var(--shadow)}
@keyframes cardIn{from{opacity:.2;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.scene.enter{animation:cardIn .28s ease-out}
.swipehint{display:none;font-size:13px;color:var(--muted);text-align:center;margin-top:10px;min-height:1em}
@media (hover:none){.swipehint{display:block}}
.linkbtn{border:0;background:none;color:var(--azul);font-weight:700;font-size:14px;padding:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom, 0px));z-index:30;transform:translate(-50%, 12px);opacity:0;transition:opacity .2s, transform .2s;
  width:max-content;max-width:min(92vw, 440px);display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 10px 10px 16px;box-shadow:0 8px 24px rgba(20,30,60,.25);font-size:15px}
.toast.show{opacity:1;transform:translate(-50%, 0)}
.toast span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{flex:none;border:0;border-radius:10px;padding:8px 14px;font-weight:700;background:var(--azul);color:var(--azul-ink)}
@media (max-width:700px){ .toast{bottom:calc(92px + env(safe-area-inset-bottom, 0px))} }
@media (prefers-reduced-motion: reduce){ .scene.enter{animation:none} .toast{transition:none} }
/* card */
.scene{perspective:1400px;margin-bottom:16px}
.card{position:relative;display:grid;min-height:260px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.3,1);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:pan-y}
.settings-row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.card.flipped{transform:rotateY(180deg)}
.face{position:relative;grid-area:1 / 1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 22px 24px;text-align:center;gap:12px;box-shadow:var(--shadow);overflow:hidden}
.face.back{transform:rotateY(180deg)}
.face.back::before{content:"";position:absolute;inset:0 0 auto 0;height:12px;background:
  radial-gradient(circle at 50% 50%, var(--azul) 0 22%, transparent 23%) 0 0/24px 24px,
  conic-gradient(from 45deg, var(--tile) 25%, transparent 0 50%, var(--tile) 0 75%, transparent 0) 0 0/24px 24px, var(--azul-soft)}
.face .tag{position:absolute;top:12px;left:14px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.face.back .tag{top:20px}
.face .lang{position:absolute;top:12px;right:14px;font-size:12px;font-weight:700;color:var(--azul);letter-spacing:.06em}
.face.back .lang{top:20px}
.word{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,6vw,40px);line-height:1.15;text-wrap:balance;overflow-wrap:anywhere;max-width:100%}
.word.long{font-size:clamp(20px,4.4vw,28px)}
.hint{color:var(--muted);font-size:14px}
.trans{font-size:clamp(17px,3.8vw,22px);color:var(--muted);border-top:2px solid var(--azul-soft);padding-top:10px;max-width:100%;overflow-wrap:anywhere;text-wrap:balance}
.btn:disabled{opacity:.4;cursor:default}
.speak{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.speak:hover{border-color:var(--azul)}
.speak svg{width:16px;height:16px}
.feedback{font-weight:700;border-radius:10px;padding:6px 12px;font-size:15px}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback.warn{background:var(--warn-soft);color:var(--warn)}
.yours{font-size:14px;color:var(--muted)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions.one{grid-template-columns:1fr}
.btn{border:0;border-radius:18px;padding:15px 18px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s, filter .12s}
.btn:not(:disabled):hover{filter:brightness(1.03);transform:translateY(-1px)}
.btn.primary{box-shadow:0 6px 16px rgba(107,143,219,.28)}
.btn.primary{background:var(--azul);color:var(--azul-ink)}
.btn.no{background:var(--bad-soft);color:var(--bad)}
.btn.yes{background:var(--ok-soft);color:var(--ok)}
.btn.plain{background:var(--surface);border:1px solid var(--line)}
.btn kbd{font-family:var(--f-body);font-size:12px;opacity:.7;border:1px solid currentColor;border-radius:5px;padding:0 5px}
.typebox{display:flex;gap:8px;margin-bottom:10px}
.typebox input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;font-size:17px}
.typebox input:focus{border-color:var(--azul)}
.accents{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.accents button{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:36px;padding:4px 8px;font-size:16px}
.keys{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
/* summary */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:24px 20px;display:grid;gap:14px}
.summary h2{font-family:var(--f-display);margin:0;font-size:26px}
.nums{display:flex;gap:24px;flex-wrap:wrap}
.nums div{display:grid}
.nums b{font-family:var(--f-display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.nums span{font-size:13px;color:var(--muted)}
.review{display:grid;gap:4px;font-size:15px}
.review div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-block:4px}
.review div span:last-child{color:var(--muted);text-align:right}
/* list */
.listtools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.listtools input{flex:1 1 220px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.lgroup{margin-bottom:22px}
.lgroup h3{font-family:var(--f-display);font-size:18px;margin:0 0 6px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lgroup h3 small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:400}
.row{display:grid;grid-template-columns:12px minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.row .pt{font-weight:700;overflow-wrap:anywhere}
.row .en{color:var(--muted);overflow-wrap:anywhere}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.l1{background:var(--warn)} .dot.l2{background:var(--ok)}
.row .speak{padding:4px 8px}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.legend span{display:inline-flex;gap:6px;align-items:center}
footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--muted);align-items:center}
.confirm{display:inline-flex;gap:8px;align-items:center}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:28px;padding:28px 20px;text-align:center;display:grid;gap:12px;justify-items:center}
@media (max-width:520px){
  .row{grid-template-columns:10px minmax(0,1fr) auto}
  .row .en{grid-column:2;grid-row:2;font-size:14px}
  .row .speak{grid-row:1 / span 2;grid-column:3}
  .card{min-height:220px}
  header.top{padding-block:14px 8px}
  h1{font-size:24px}
  .sub{font-size:13px;margin-top:2px}
  nav.tabs{margin-bottom:12px}
  nav.tabs button{padding:8px 12px}
  .controls{gap:8px;margin-bottom:10px}
  .seg{display:flex;width:100%}
  .seg button{flex:1;padding:7px 6px}
  details.topics{margin-bottom:12px}
  details.topics>summary{padding:10px 14px;font-size:15px}
  .bar{margin-bottom:12px}
  .face{padding:46px 18px 20px}
  .btn{padding:14px 12px}
}
@media (hover:none){ .keys, .btn kbd{display:none} }
@media (prefers-reduced-motion: reduce){.card{transition:none}.bar i{transition:none}}

var VOICE = null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  var vs = speechSynthesis.getVoices();
  VOICE = vs.find(function(v){ return /pt[-_]PT/i.test(v.lang); }) || vs.find(function(v){ return /^pt/i.test(v.lang); }) || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function sayable(s){
  return s.replace(/\([^)]*\)/g,' ').replace(/\/(?:a|os|as|es)(?:\/(?:os|as))*(?=[\s.,!?…]|$)/g,'').replace(/\s\/\s/g,', ').replace(/…/g,'').trim();
}
function speak(s){
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(sayable(s));
    u.lang = VOICE ? VOICE.lang : 'pt-PT'; if(VOICE) u.voice = VOICE; u.rate = 0.9;
    speechSynthesis.speak(u);
  }catch(e){}
}

// split "em cima da" → {base:"em cima de", art:"a"}; "entre o" → {base:"entre", art:"o"}
function splitPrep(s){
  s = pnorm(s);
  var m = s.match(/^(.*?)\s*\b(do|da|dos|das)$/);
  if(m && m[1]) return {base: (m[1] + ' de').trim(), art: m[2].slice(1), contracted: true};
  m = s.match(/^(.*?)\s+de\s+(o|a|os|as)$/);
  if(m) return {base: m[1] + ' de', art: m[2], contracted: false};
  m = s.match(/^(entre)\s+(o|a|os|as)$/);
  if(m) return {base: 'entre', art: m[2], contracted: true};
  return {base: s.replace(/\s+de$/, ' de'), art: null, contracted: false};
}
function prepInfo(base){
  var p = plain(base);

}

function phraseBase(phrase){
  var p = plain(pnorm(phrase)), best = null;
  PREPS.forEach(function(x){ [x.b].concat(x.alt || []).forEach(function(b){ var stem = plain(b).replace(/ de$/, ''); if(p.indexOf(stem) === 0 && (!best || stem.length > best.len)) best = {b: b, len: stem.length}; }); });

      model = it.subj + ' ' + it.verb + ' ' + it.a[0] + '.';
      var hasVerb = VERB_RE.test(a);
      var hit = acc.filter(function(x){ return a.indexOf(x) >= 0; })[0];
      if(hit && hasVerb) return {ok: true, html: '<div class="p-res">Correct!</div><div class="p-full">' + esc(ans) + '</div>' + (acc.length > 1 ? '<div class="why">Other good answers: ' + it.a.filter(function(x){ return pnorm(x) !== hit; }).slice(0, 3).map(function(x){ return esc(it.subj + ' ' + it.verb + ' ' + x + '.'); }).join(' · ') + '</div>' : '')};
      if(hit) return {ok: false, html: '<div class="p-res">Good location, but write a complete sentence with the verb.</div><div class="p-full">' + esc(model) + '</div><div class="why">Use <b>' + it.verb + '</b> for location: ' + esc(it.subj) + ' ' + it.verb + ' …</div>'};
      if(acc.some(function(x){ return plain(a).indexOf(plain(x)) >= 0; }) && hasVerb) return {ok: 'almost', html: '<div class="p-res">Almost — check the accents.</div><div class="p-full">' + esc(model) + '</div>'};
      phrase = a.replace(/^.*?(está|estão|fica|ficam)\s*/, '');
      var mineF = prepInfo(phraseBase(phrase));
      return {ok: false, html: '<div class="p-res">' + (a ? 'Not quite.' : 'Here is the answer.') + ' A good answer:</div><div class="p-full">' + esc(model) + '</div><div class="why">'
        + (mineF && a ? 'You used <i>' + esc(mineF.b) + '</i> = ' + mineF.m + '. ' : '') + 'Look at the picture: ' + prepExplain(phraseBase(it.a[0])) + '.</div>'
        + (it.a.length > 1 ? '<div class="why">Also correct: ' + it.a.slice(1, 4).map(function(x){ return esc(it.subj + ' ' + it.verb + ' ' + x + '.'); }).join(' · ') + '</div>' : '')};
    }
    var full = blankHtml(it.s, it.a[0]);
    if(acc.indexOf(a) >= 0) return {ok: true, html: '<div class="p-res">Correct!</div><div class="p-full">' + blankHtml(it.s, ans.trim()) + '</div><div class="why">' + prepExplain(splitPrep(a).base) + '</div>'};
    if(acc.some(function(x){ return plain(x) === plain(a); })) return {ok: 'almost', html: '<div class="p-res">Almost — check the accent: <b>' + esc(it.a.filter(function(x){ return plain(x) === plain(a); })[0]) + '</b></div><div class="p-full">' + full + '</div>'};
    var u = splitPrep(a), good = it.a.map(splitPrep), sameBase = good.filter(function(g){ return plain(g.base) === plain(u.base) || (prepInfo(u.base) && prepInfo(u.base) === prepInfo(g.base)); })[0];
    var corr = '<div class="p-full">' + full + '</div>';
    if(sameBase){
      var right = contrOf(sameBase.base, it.art);
      if(u.art === it.art && !u.contracted) return {ok: false, html: '<div class="p-res">Right preposition — now contract it: <b>' + esc(right) + '</b></div>' + corr + '<div class="why">de + ' + it.art + ' = d' + it.art + '. In Portuguese “de o / de a / de os / de as” always becomes do / da / dos / das.</div>'};
      return {ok: false, html: '<div class="p-res">Right preposition, wrong ending. Correct: <b>' + esc(right) + '</b></div>' + corr + '<div class="why">The next word is ' + articleWord(it.art) + ', so ' + (sameBase.base === 'entre' ? 'entre ' + it.art : 'de + ' + it.art + ' = d' + it.art) + '.</div>'};
    }
    var mine = prepInfo(u.base);
    return {ok: false, html: '<div class="p-res">' + (a ? 'Not quite.' : 'Here is the answer.') + ' Correct: <b>' + esc(it.a[0]) + '</b>' + (it.a.length > 1 ? ' (or ' + it.a.slice(1).map(esc).join(', ') + ')' : '') + '</div>' + corr
      + '<div class="why">' + (mine ? 'You wrote <i>' + esc(u.base) + '</i> = ' + mine.m + '. ' : '') + 'Look at the picture: ' + prepExplain(good[0].base) + '.</div>'};
  },
  review: function(it){ return it.full ? it.subj + ' ' + it.verb + ' ' + it.a[0] + '.' : it.s.replace('___', '[' + it.a[0] + ']'); }
};

var PQ = null;
function pStart(act, items, opt){ PQ = {act: act, items: items, total: items.length, queue: items.slice(), done: 0, firstOk: 0, tried: {}, wrongIds: {}, wrong: [], fb: null, hint: false, opt: opt || {}}; pRender(); }
function pAnswer(val){
  var it = PQ.queue[0], res = ACT[PQ.act].check(it, val);
  if(!PQ.tried[it.id]){ PQ.tried[it.id] = 1; pxRec(PQ.act, it.id, res.ok === true); }
  PQ.fb = res; PQ.typed = val; pRender();
}
function pNext(){
  var it = PQ.queue.shift();
  if(PQ.fb.ok === true){ PQ.done++; if(!PQ.wrongIds[it.id]) PQ.firstOk++; }
  else { if(!PQ.wrongIds[it.id]){ PQ.wrongIds[it.id] = 1; PQ.wrong.push(it); } PQ.queue.splice(Math.min(3, PQ.queue.length), 0, it); }
  PQ.fb = null; PQ.hint = false; pRender();
}
function pTop(title, right){
  return '<div class="p-top"><button type="button" class="linkbtn" data-p="home">‹ Activities</button><span class="p-title">' + title + '</span><span class="p-count">' + (right || '') + '</span></div>';
}
function pRender(){
  var A = ACT[PQ.act], it = PQ.queue[0], h = '';

      + (PQ.wrong.length ? '<div><strong>To review</strong><div class="review">' + PQ.wrong.map(function(x){ return '<div><span>' + esc(A.review(x)) + '</span></div>'; }).join('') + '</div></div>' : '')

  }
  $('pBody').innerHTML = pTop(A.title, '') + h;
  setTimeout(function(){ var f = $(PQ.fb ? 'pNextBtn' : 'pIn'); if(f && !$('practice').hidden) f.focus({preventScroll: true}); }, 30);

  if(b.id === 'allTopics'){ S.cats = CATS.map(function(c){ return c.id; }); saveS(); renderTopics(); newRound(); return; }

  if(b.dataset.ch){ var inp = $(b.dataset.target || 'answer'), s = inp.selectionStart||inp.value.length, en = inp.selectionEnd||s; inp.value = inp.value.slice(0,s) + b.dataset.ch + inp.value.slice(en); inp.focus(); inp.setSelectionRange(s+1,s+1); return; }
  if(b.dataset.say){ speak(b.dataset.say); return; }
  if(b.id === 'fSpeak' || b.id === 'bSpeak'){ e.stopPropagation(); if(S.mode === 'learn'){ if(LR.list.length) speak(LR.list[LR.i].pt); return; } var c0 = cur(); if(c0) speak(c0.it.pt); return; }
  if(b.id === 'resetBtn'){ var t = L(); $('resetWrap').innerHTML = '<span class="confirm">'+t.resetQ+' <button class="ghost" type="button" id="resetYes">'+t.yes+'</button><button class="ghost" type="button" id="resetNo">'+t.no+'</button></span>'; return; }
  if(b.id === 'resetYes'){ P = {}; store('p103-progress', P); resetFooter(); renderTopics(); renderTotals(); newRound(); if(!$('list').hidden) renderList(); return; }
  if(b.id === 'resetNo'){ resetFooter(); return; }
  var a = b.dataset.act;
  if(S.mode === 'learn'){
    if(b.id === 'card'){ if(Date.now() - swipedAt > 500) learnStep(1); return; }
    if(a === 'next') return learnStep(1);
    if(a === 'prev') return learnStep(-1);
    if(a === 'practise'){ S.mode = 'flip'; saveS(); renderChrome(); newRound(); return; }
  }
  if(b.id === 'card' || a === 'flip'){ if(b.id === 'card' && Date.now() - swipedAt < 350) return; if(S.mode === 'flip' && R && cur()){ R.flipped = !R.flipped; renderStudy(); } return; }
  if(a === 'yes') return grade(true);
  if(a === 'no') return grade(false);
  if(a === 'next-ok') return grade(true);
  if(a === 'next-bad') return grade(false);
  if(a === 'override'){ R.result = 'right'; return grade(true); }
  if(a === 'newround') return newRound();
  if(a === 'includeall') return newRound(true);
  if(a === 'opentopics'){ $('topics').open = true; $('topics').scrollIntoView({block:'start', behavior:'smooth'}); return; }
  if(a === 'closetopics'){ $('topics').open = false; window.scrollTo({top:0, behavior:'smooth'}); return; }
});
// light / dark switch (remembers the choice; follows the phone until you press it)
var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>';
var DARKQ = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
function isDark(){ var a = document.documentElement.getAttribute('data-theme'); return a ? a === 'dark' : !!(DARKQ && DARKQ.matches); }
function showTheme(){
  var d = isDark(), b = $('themeBtn');
  b.innerHTML = d ? SUN : MOON;
  b.setAttribute('aria-label', d ? 'Switch to light mode' : 'Switch to dark mode'); b.title = b.getAttribute('aria-label');
  document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){ m.content = d ? '#161c2c' : '#f7f9fd'; });
}
(function(){ var th = null; try{ th = localStorage.getItem('p103-theme'); }catch(e){} if(th === 'dark' || th === 'light') document.documentElement.setAttribute('data-theme', th); showTheme(); })();
if(DARKQ && DARKQ.addEventListener) DARKQ.addEventListener('change', showTheme);
$('themeBtn').addEventListener('click', function(){
  var th = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', th);
  try{ localStorage.setItem('p103-theme', th); }catch(e){}
  showTheme();
});
$('topics').addEventListener('toggle', function(){ $('topicsBtn').textContent = this.open ? L().closeP : L().change; });
$('typeForm').addEventListener('submit', function(e){
  e.preventDefault();
  var c = cur(); if(!c || R.checked) return;
  var back = c.dir === 'pt-en' ? 'en' : 'pt';
  R.typed = $('answer').value.trim();
  R.result = checkAnswer(c.it, back, R.typed);
  R.checked = true; R.flipped = true;
  renderStudy();
  if(CAN_SPEAK && back === 'pt' && R.result !== 'wrong') speak(c.it.pt);
});
// swipe: Learn = change card; Flashcards (after flipping) = right "I know it", left "Again"
var drag = null, swipedAt = 0;
function canSwipe(){ return (S.mode === 'learn' && LR.list.length) || (S.mode === 'flip' && R && R.flipped && cur()); }
(function(){
  var card = $('card');
  function reset(){ card.style.transition = ''; card.style.transform = ''; card.classList.remove('drag-yes', 'drag-no'); }
  card.addEventListener('touchstart', function(e){ var t = e.touches[0]; drag = {x: t.clientX, y: t.clientY, dx: 0, on: false}; }, {passive:true});
  card.addEventListener('touchmove', function(e){
    if(!drag) return;
    var t = e.touches[0], dx = t.clientX - drag.x, dy = t.clientY - drag.y;
    if(!drag.on){
      if(Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) drag.on = true;
      else { if(Math.abs(dy) > 10) drag = null; return; }
    }
    if(!canSwipe()) return;
    drag.dx = dx;
    card.style.transition = 'none';
    card.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 22) + 'deg)' + (card.classList.contains('flipped') ? ' rotateY(180deg)' : '');
    card.classList.toggle('drag-yes', S.mode === 'flip' && dx > 60);
    card.classList.toggle('drag-no', S.mode === 'flip' && dx < -60);
  }, {passive:true});
  card.addEventListener('touchend', function(){
    if(!drag) return;
    var d = drag; drag = null;
    if(!d.on || Math.abs(d.dx) < 70 || !canSwipe()){ reset(); return; }
    swipedAt = Date.now();
    card.classList.add('noanim'); reset(); void card.offsetWidth; card.classList.remove('noanim');
    if(S.mode === 'learn') learnStep(d.dx < 0 ? 1 : -1);
    else grade(d.dx > 0);
  }, {passive:true});
  card.addEventListener('touchcancel', function(){ drag = null; reset(); }, {passive:true});
})();
document.addEventListener('submit', function(e){
  if(e.target.id !== 'pForm') return;
  e.preventDefault();
  var v = $('pIn').value.trim();
  if(!v){ $('pIn').focus(); $('pIn').classList.remove('nudge'); void $('pIn').offsetWidth; $('pIn').classList.add('nudge'); return; }
  pAnswer(v);
});
$('sheetBg').addEventListener('click', shClose);
document.addEventListener('keydown', function(e){
  if($('practice').hidden) return;
  if(e.key === 'Escape' && !$('sheet').hidden){ shClose(); return; }
  var tag = (e.target.tagName || '').toLowerCase();
  if(e.key === 'Enter' && PQ && PQ.fb && tag !== 'button'){ e.preventDefault(); pNext(); }
});
function announceResume(){ if(S.mode === 'learn' && LR.i > 0) toast(L().resumed(LR.i + 1), L().startOver, learnRestart); }
document.addEventListener('keydown', function(e){
  var tag = (e.target.tagName || '').toLowerCase();
  if((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z') && UNDO && tag !== 'input'){ e.preventDefault(); undo(); return; }
  if(!$('study').hidden && S.mode === 'learn' && LR.list.length && tag !== 'input' && tag !== 'select'){
    if(e.key === 'ArrowRight'){ e.preventDefault(); learnStep(1); }
    else if(e.key === 'ArrowLeft'){ e.preventDefault(); learnStep(-1); }
    else if(e.key === ' ' && tag !== 'button'){ e.preventDefault(); speak(LR.list[LR.i].pt); }
    return;
  }
  if($('study').hidden || !R || !cur()) return;
  if(S.mode === 'type'){
    if(R.checked && e.key === 'Enter'){ e.preventDefault(); grade(R.result !== 'wrong'); }
    return;
  }
  if(tag === 'input' || tag === 'select' || (tag === 'button' && e.key !== 'ArrowLeft' && e.key !== 'ArrowRight' && e.target.id !== 'card')) return;
  if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); R.flipped = !R.flipped; renderStudy(); }
  else if(e.key === 'ArrowRight' && R.flipped){ grade(true); }
  else if(e.key === 'ArrowLeft' && R.flipped){ grade(false); }
});
$('roundSize').addEventListener('change', function(){ S.round = +this.value; saveS(); newRound(); });
$('weakOnly').addEventListener('change', function(){ S.weak = this.checked; saveS(); newRound(); });
$('search').addEventListener('input', renderList);
$('listCat').addEventListener('change', renderList);

renderChrome();
newRound();
announceResume();
